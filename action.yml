# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Cloudcostify Budget Guard'
description: 'Automated cloud infrastructure cost estimation and budget guard for pull requests. Supports Pulumi'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  api-key:
    description: 'Your Cloudcostify API key. Get one at cloudcostify.io'
    required: true
  provider:
    description: 'IaC provider to use. Supported values: pulumi'
    required: false
    default: 'pulumi'
  working-directory:
    description: 'Path to the directory containing your IaC project files'
    required: false
    default: '.'
  stack-name:
    description: 'Pulumi stack name (e.g. dev, prod). Only required when provider is pulumi'
    required: false
    default: 'dev'
  pulumi-access-token:
    description: 'Pulumi access token. Only required when provider is pulumi'
    required: false
  budget:
    description: 'Monthly budget limit in USD (non-negative number). When the estimated cost exceeds this value, budget-exceeded is set to true'
    required: false
  markdown-output:
    description: 'File path to write a Markdown cost report (e.g. cloudcostify-report.md)'
    required: false
  cli-version:
    description: >-
      Version of the Cloudcostify CLI to download. Use a release tag (e.g. v1.0.0) or "latest".
      "latest" resolves to whatever tag is newest at run time, which is convenient but not
      reproducible; pin an explicit tag for production use once a stable release exists.
    required: false
    default: 'latest'

outputs:
  budget-exceeded:
    description: 'Set to "true" if the estimated monthly cost exceeds the configured budget limit'
    value: ${{ steps.run-cli.outputs.budget_exceeded }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs and resolve platform
      id: platform
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_BUDGET: ${{ inputs.budget }}
      run: |
        set -euo pipefail
        source "${{ github.action_path }}/scripts/lib.sh"

        # Validate everything that does not require a network call first, so
        # a malformed input fails fast without ever contacting GitHub.
        validate_cli_version "$INPUT_CLI_VERSION"
        validate_provider "$INPUT_PROVIDER"
        validate_budget "$INPUT_BUDGET"

        VERSION="$INPUT_CLI_VERSION"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cloudcostify/cli/releases/latest" \
            | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          validate_cli_version "$VERSION"
        fi

        RID=$(detect_rid)
        BINARY=$(binary_filename "$RID")

        echo "Resolved Cloudcostify CLI ${VERSION} for ${RID}"

        {
          echo "rid=${RID}"
          echo "binary=${BINARY}"
          echo "version=${VERSION}"
        } >> "$GITHUB_OUTPUT"

    - name: Download and verify Cloudcostify CLI
      id: download-cli
      shell: bash
      env:
        RID: ${{ steps.platform.outputs.rid }}
        BINARY: ${{ steps.platform.outputs.binary }}
        VERSION: ${{ steps.platform.outputs.version }}
      run: |
        set -euo pipefail
        source "${{ github.action_path }}/scripts/lib.sh"

        BASE_URL="https://github.com/cloudcostify/cli/releases/download/${VERSION}"
        BINARY_PATH="${RUNNER_TEMP}/${BINARY}"
        SUMS_PATH="${RUNNER_TEMP}/SHA256SUMS"

        echo "Fetching: ${BASE_URL}/${BINARY}"
        curl -sSfL "${BASE_URL}/${BINARY}" -o "$BINARY_PATH"
        curl -sSfL "${BASE_URL}/SHA256SUMS" -o "$SUMS_PATH"

        verify_checksum "$BINARY_PATH" "$BINARY" "$SUMS_PATH"

        chmod +x "$BINARY_PATH"
        echo "cli-path=${BINARY_PATH}" >> "$GITHUB_OUTPUT"

    - name: Run Cloudcostify CLI
      id: run-cli
      shell: bash
      env:
        CLI_PATH: ${{ steps.download-cli.outputs.cli-path }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_MARKDOWN_OUTPUT: ${{ inputs.markdown-output }}
        CLOUDCOSTIFY_API_KEY: ${{ inputs.api-key }}
        CLOUDCOSTIFY_PULUMI_PROJECT_STACK_NAME: ${{ inputs.stack-name }}
        CLOUDCOSTIFY_PULUMI_PROJECT_DIRECTORY_PATH: ${{ inputs.working-directory }}
        PULUMI_ACCESS_TOKEN: ${{ inputs.pulumi-access-token }}
      run: |
        set -euo pipefail
        source "${{ github.action_path }}/scripts/lib.sh"

        validate_provider "$INPUT_PROVIDER"
        validate_budget "$INPUT_BUDGET"

        args=(--provider "$INPUT_PROVIDER" --directory "$INPUT_WORKING_DIRECTORY")

        if [[ -n "$INPUT_BUDGET" ]]; then
          args+=(--budget "$INPUT_BUDGET")
        fi

        if [[ -n "$INPUT_MARKDOWN_OUTPUT" ]]; then
          args+=(--out-markdown "$INPUT_MARKDOWN_OUTPUT")
        fi

        "$CLI_PATH" "${args[@]}"
